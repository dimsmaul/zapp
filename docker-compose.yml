name: zapp

services:
  mongo:
    image: mongo:7.0
    command: ["mongod", "--replSet", "zapp", "--bind_ip_all"]
    ports:
      - "127.0.0.1:${ZAPP_MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db

  mongo-init:
    image: mongo:7.0
    depends_on:
      mongo:
        condition: service_started
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for attempt in $$(seq 1 45); do
          if mongosh 'mongodb://mongo:27017/?directConnection=true' --quiet --eval '
            try { rs.status() } catch (e) {
              if (e.code !== 94) throw e;
              rs.initiate({_id: "zapp", members: [{_id: 0, host: "mongo:27017"}]});
            }
            quit(db.hello().isWritablePrimary ? 0 : 1);
          '; then exit 0; fi
          sleep 1
        done
        exit 1

  migrate:
    build:
      context: .
      dockerfile: zapp/apps/server/Dockerfile
    command: ["migrate"]
    environment:
      ZAPP_MONGODB_URI: "mongodb://mongo:27017/?replicaSet=zapp"
      ZAPP_MONGODB_DATABASE: "zapp"
    depends_on:
      mongo-init:
        condition: service_completed_successfully

  server:
    init: true
    build:
      context: .
      dockerfile: zapp/apps/server/Dockerfile
    environment:
      ZAPP_BIND_ADDR: "0.0.0.0:8080"
      ZAPP_WEB_ORIGIN: "${ZAPP_WEB_ORIGIN:-http://localhost:5173}"
      ZAPP_MONGODB_URI: "mongodb://mongo:27017/?replicaSet=zapp"
      ZAPP_MONGODB_DATABASE: "zapp"
      ZAPP_STORAGE_BUCKET: "${ZAPP_STORAGE_BUCKET:-}"
      ZAPP_STORAGE_REGION: "${ZAPP_STORAGE_REGION:-us-east-1}"
      ZAPP_STORAGE_ENDPOINT: "${ZAPP_STORAGE_ENDPOINT:-}"
      ZAPP_STORAGE_ACCESS_KEY_ID: "${ZAPP_STORAGE_ACCESS_KEY_ID:-}"
      ZAPP_STORAGE_SECRET_ACCESS_KEY: "${ZAPP_STORAGE_SECRET_ACCESS_KEY:-}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${ZAPP_SERVER_PORT:-8080}:8080"

  web:
    build:
      context: .
      dockerfile: zapp/apps/web/Dockerfile
    ports:
      - "127.0.0.1:${ZAPP_WEB_PORT:-5173}:80"

volumes:
  mongo_data:
