name: Release server

# Tag server-vX.Y.Z      -> image ghcr.io/<owner>/zapp-server:X.Y.Z + latest, then deploys to the Oracle VM.
# Tag server-vX.Y.Z-beta.N -> image ghcr.io/<owner>/zapp-server:X.Y.Z-beta.N + beta. No deploy.
on:
  push:
    tags: ["server-v*"]

concurrency:
  group: release-server
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    # Build on the same CPU architecture as the VM (repository variable DEPLOY_ARCH=arm64 for Oracle Ampere).
    runs-on: ${{ vars.DEPLOY_ARCH == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 45
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '~/zapp' }}
      SERVER_PORT: ${{ vars.SERVER_PORT || '8080' }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: v
        run: |
          version="${GITHUB_REF_NAME#server-v}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}-server"
          if [[ "$version" == *-* ]]; then channel=beta; else channel=latest; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          build-args: VERSION=${{ steps.v.outputs.version }}
          load: true
          tags: |
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.channel }}
            zapp-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push to GHCR
        run: docker push --all-tags "${{ steps.v.outputs.image }}"

      - name: GitHub release
        run: |
          flags=()
          [[ "${{ steps.v.outputs.channel }}" == beta ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" --title "Server ${{ steps.v.outputs.version }}" --generate-notes "${flags[@]}"
        env:
          GH_TOKEN: ${{ github.token }}

      # Only stable tags reach the VM.
      - name: Configure SSH
        if: steps.v.outputs.channel == 'latest'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          # Output of `ssh-keyscan -p <port> <host>`, so the host key is pinned rather than trusted on first use.
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Copy image and compose file to the server
        if: steps.v.outputs.channel == 'latest'
        run: |
          ssh_options=(-i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          target="$SSH_USER@$SSH_HOST"

          ssh "${ssh_options[@]}" -p "$SSH_PORT" "$target" "mkdir -p $DEPLOY_PATH"
          # Keep the running image as "previous" so a bad release can be rolled back by hand.
          ssh "${ssh_options[@]}" -p "$SSH_PORT" "$target" "docker tag zapp-backend:latest zapp-backend:previous 2>/dev/null || true"
          docker save zapp-backend:latest | gzip | ssh "${ssh_options[@]}" -p "$SSH_PORT" "$target" "gunzip | docker load"
          scp "${ssh_options[@]}" -P "$SSH_PORT" deploy/docker-compose.prod.yml "$target:$DEPLOY_PATH/docker-compose.yml"

      - name: Restart the stack
        if: steps.v.outputs.channel == 'latest'
        run: |
          ssh_options=(-i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          # `docker compose up` applies the migration first, then starts the server and worker.
          ssh "${ssh_options[@]}" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "cd $DEPLOY_PATH && docker compose up -d --remove-orphans"

      - name: Wait until the server is ready
        if: steps.v.outputs.channel == 'latest'
        run: |
          ssh_options=(-i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          ssh "${ssh_options[@]}" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
            for attempt in \$(seq 1 20); do
              curl -fsS http://127.0.0.1:$SERVER_PORT/readyz && exit 0
              sleep 3
            done
            cd $DEPLOY_PATH && docker compose logs --tail=60 server
            exit 1
          "
