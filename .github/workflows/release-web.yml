name: Release web

# Tag web-vX.Y.Z        -> image ghcr.io/<owner>/zapp-web:X.Y.Z + latest.
# Tag web-vX.Y.Z-beta.N -> image ghcr.io/<owner>/zapp-web:X.Y.Z-beta.N + beta (the UI shows a Beta badge).
# The hosted site itself is deployed by Vercel on push to main, not by this workflow.
on:
  push:
    tags: ["web-v*"]

concurrency:
  group: release-web
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: v
        run: |
          version="${GITHUB_REF_NAME#web-v}"
          if [[ "$version" == *-* ]]; then channel=beta; else channel=latest; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-web" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          build-args: VITE_ZAPP_VERSION=${{ steps.v.outputs.version }}
          push: true
          tags: |
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.channel }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: GitHub release
        run: |
          flags=()
          [[ "${{ steps.v.outputs.channel }}" == beta ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" --title "Web ${{ steps.v.outputs.version }}" --generate-notes "${flags[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
