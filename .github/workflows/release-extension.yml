name: Release extension

# Tag extension-vX.Y.Z        -> zapp-extension-X.Y.Z.zip on a GitHub release.
# Tag extension-vX.Y.Z-beta.N -> zapp-extension-X.Y.Z-beta.N.zip on a pre-release; the extension is
#                                named "Zapp Beta" and its popup shows a Beta badge.
# Chrome only accepts numeric versions, so the beta number goes in version_name and the manifest
# version stays X.Y.Z. Stable zips are also sent to the Chrome Web Store; beta zips are for manual install.
on:
  push:
    tags: ["extension-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp manifest and zip
        id: v
        run: |
          version="${GITHUB_REF_NAME#extension-v}"
          base="${version%%-*}"
          cd apps/extension
          if [[ "$version" == *-* ]]; then
            beta=true
            jq --arg v "$base" --arg n "$version" '.version=$v | .version_name=$n | .name="Zapp Beta"' manifest.json > manifest.tmp
          else
            beta=false
            jq --arg v "$base" '.version=$v | .version_name=$v' manifest.json > manifest.tmp
          fi
          mv manifest.tmp manifest.json
          cat manifest.json | jq '{name,version,version_name}'
          zip -r "../../zapp-extension-$version.zip" . -x '*.DS_Store'
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "beta=$beta" >> "$GITHUB_OUTPUT"

      - name: GitHub release
        run: |
          flags=()
          [[ "${{ steps.v.outputs.beta }}" == true ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "zapp-extension-${{ steps.v.outputs.version }}.zip" \
            --title "Extension ${{ steps.v.outputs.version }}" --generate-notes "${flags[@]}"
        env:
          GH_TOKEN: ${{ github.token }}

      # Stable tags only. Uploads the zip and submits it for review; Google publishes it once approved.
      # The upload is refused while the previous version is still in review, and a new permission needs its
      # justification filled in on the dashboard first. The GitHub release above exists either way.
      - name: Publish to the Chrome Web Store
        if: steps.v.outputs.beta == 'false'
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          for name in EXTENSION_ID PUBLISHER_ID CLIENT_ID CLIENT_SECRET REFRESH_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret CWS_$name. See docs/releasing.md."
              exit 1
            fi
          done
          npx --yes chrome-webstore-upload-cli@4.0.2 --source "zapp-extension-${{ steps.v.outputs.version }}.zip"
