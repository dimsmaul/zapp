<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zapp</title>
    <link rel="stylesheet" href="ui.css">
  </head>
  <body>
    <main class="popup">
      <header class="brand">
        <img class="logo" src="logo.svg" alt="">
        <h1>Zapp</h1>
        <button id="change-server" type="button" class="quiet small" hidden>Change server</button>
        <button id="close-panel" type="button" class="quiet icon" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </header>
      <p id="status" role="status" aria-live="polite" hidden></p>

      <form id="connect" class="stack" hidden>
        <div><h2>Connect to Zapp</h2><p class="muted">Enter the URL of your Zapp server.</p></div>
        <label>Server URL<input name="origin" type="url" placeholder="https://zapp.example.com" required></label>
        <button type="submit" class="primary">Continue</button>
      </form>

      <form id="login" class="stack" hidden>
        <div><h2>Sign in</h2><p id="server" class="muted ellipsis"></p></div>
        <label>Email<input name="email" type="email" autocomplete="username" required></label>
        <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
        <button type="submit" class="primary">Sign in</button>
      </form>

      <form id="workspace" class="stack" hidden>
        <div><h2>Choose a workspace</h2><p id="workspace-hint" class="muted">Captures will be saved here.</p></div>
        <label>Workspace<select name="id" required></select></label>
        <button type="submit" class="primary">Continue</button>
      </form>

      <section id="capture" class="stack" hidden>
        <div class="target"><span class="label">Capture target</span><p id="selection" class="ellipsis"></p></div>
        <div class="actions">
          <button id="screenshot" class="action-card" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.997 4a2 2 0 0 1 1.76 1.05l.486.9A2 2 0 0 0 18.003 7H20a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1.997a2 2 0 0 0 1.759-1.048l.489-.904A2 2 0 0 1 10.004 4z"/><circle cx="12" cy="13" r="3"/></svg>Screenshot</button>
          <button id="record" class="action-card primary" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg>Record tab</button>
        </div>
        <button id="show-tabs" class="quiet small" type="button" aria-controls="tab-picker" aria-expanded="false">Choose another tab</button>
        <form id="tab-picker" class="stack inset" hidden>
          <label>Tab to record<select name="tab" required></select></label>
          <button type="submit">Open selected tab</button>
        </form>
        <div class="row footer">
          <button id="switch-workspace" type="button" class="quiet small">Switch workspace</button>
          <button id="logout" type="button" class="quiet small">Sign out</button>
        </div>
      </section>

      <section id="recording" class="stack" hidden>
        <div class="rec-head"><span class="rec-dot" aria-hidden="true"></span><h2>Recording tab</h2></div>
        <output id="elapsed">0:00</output>
        <div class="actions"><button id="pause" type="button">Pause</button><button id="stop" class="danger" type="button">Stop recording</button></div>
      </section>
      <button id="drafts" type="button" class="quiet small drafts" hidden>Open drafts</button>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
