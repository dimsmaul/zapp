[package]
name = "zapp-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[dependencies]
axum = "0.8"
flate2 = "=1.1.8"
futures-util = "0.3"
mongodb = "=3.5.2"
object_store = { version = "=0.13.1", default-features = false, features = ["aws", "tls-webpki-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.9"
ring = "0.17"
base64 = "0.22"
url = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false }
tower = { version = "0.5", features = ["util"] }
